services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: peladaplay-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PeladaPlay@2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - peladaplay_sqldata:/var/opt/mssql
    restart: unless-stopped

volumes:
  peladaplay_sqldata: {}